[tool.poetry]
name = "gptnl_dataloader"
version = "0.1.0"
description = "Loading data from curated to reading for the GPT-NL project."
authors = ["TNO <gpt-nl@tno.nl>"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
ipykernel = "^6.29.5"
pandas = "^2.2.3"
pyarrow = "20.0.0"
tqdm = "^4.67.1"
pyyaml = "^6.0.2"
tabulate = "^0.9.0"
numpy = "^2.2.5"
seaborn = "^0.13.2"
fasteners = "^0.19"
python-dotenv = "^1.1.0"
scikit-learn = "^1.7.0"
fastparquet = "^2024.11.0"
duckdb = "^1.3.1"
datasets = "^4.0.0"
transformers = "^4.54.1"
sentencepiece = "^0.2.0"
protobuf = "^6.31.1"
typer = "^0.16.0"

[tool.poetry.group.dev.dependencies]
sentencepiece = "^0.2.0"
datatrove = "^0.5.0"
regex = "^2024.11.6"
aiohttp = "^3.11.18"
spacy = "^3.8.5"
pytest = "^8.4.0"
ruff = "^0.15.17"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
